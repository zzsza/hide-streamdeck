<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hide Needs You Agent Settings</title>
    <link rel="stylesheet" href="./pi-shared.css" />
    <script src="./pi-shared.js" defer></script>
  </head>
  <body>
    <main class="pi-section">
      <div class="pi-heading">Key Settings</div>

      <div class="pi-row">
        <label for="slot">Slot</label>
        <input
          id="slot"
          type="number"
          min="1"
          max="20"
          step="1"
          data-action-setting="slot"
          data-default="1"
        />
        <div class="pi-hint">1-based Needs You slot number (1 to 20).</div>
      </div>

      <div class="pi-heading">Data Source (Global)</div>

      <div class="pi-row">
        <label for="source">Source</label>
        <select id="source" data-global-setting="source">
          <option value="hide">Hide CLI (live)</option>
          <option value="fake">Fake scenario</option>
        </select>
      </div>

      <div class="pi-row" data-visible-when-source="hide">
        <label for="hidePath">Hide Path</label>
        <input
          id="hidePath"
          type="text"
          data-global-setting="hidePath"
          placeholder="/Applications/hide.app/Contents/Resources/hide"
        />
        <div class="pi-hint">Path to the Hide CLI binary.</div>
      </div>

      <div class="pi-row" data-visible-when-source="fake">
        <label for="fakeScenario">Scenario</label>
        <select id="fakeScenario" data-global-setting="fakeScenario">
          <option value="empty">0 agents (empty)</option>
          <option value="working-many">Multiple working</option>
          <option value="needs-you-one">1 Needs You</option>
          <option value="needs-you-many">Multiple Needs You (long text)</option>
          <option value="not-connected">Not connected</option>
          <option value="pending">Pending approval</option>
          <option value="refused">Refused</option>
          <option value="revoked">Revoked</option>
          <option value="expired">Expired</option>
          <option value="hide-unavailable">Hide unavailable</option>
          <option value="hide-outdated">Hide outdated</option>
          <option value="hide-missing">Hide missing</option>
          <option value="error">Error</option>
          <option value="cycling">Cycling over time</option>
        </select>
      </div>
    </main>
    <script>
      (function () {
        var slotInput = document.getElementById("slot");
        if (!slotInput) return;

        function isValidSlot(raw) {
          var trimmed = String(raw).trim();
          if (trimmed === "") return true;
          var parsed = Number(trimmed);
          return Number.isInteger(parsed) && parsed >= 1 && parsed <= 20;
        }

        function guardSlotInput() {
          if (isValidSlot(slotInput.value)) {
            return;
          }
          var saved =
            window.hidePropertyInspector &&
            window.hidePropertyInspector.getActionSettings().slot;
          var fallback =
            typeof saved === "number" && Number.isInteger(saved) && saved >= 1 && saved <= 20
              ? String(saved)
              : slotInput.getAttribute("data-default") || "1";
          slotInput.value = fallback;
        }

        slotInput.addEventListener("change", guardSlotInput, true);
        slotInput.addEventListener("blur", guardSlotInput, true);
      })();
    </script>
  </body>
</html>
